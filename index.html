<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>School Lessons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--script tag for this version-->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
  <div id="app">
    <!-- <img v-bind:src="blog_mathslessonplanning-1.webp"  alt="This is the school lessons"> -->
    <h1>{{site}}</h1>
    <div v-for="lesson in lessons" :key="lesson.id">
      <h2>{{lesson.title}}</h2>
      <p>{{lesson.description}}</p> <!---->
      <p>Price: {{lesson.price}}</p> <!--better syntax practice than 'vtext'-->
      <!--Like onclick but in vue syntax works as event listener-->
      <button v-on:click="addToCart">
        Add to cart
      </button>
    </div>
  </div>

  <script src="lesson.js"></script>
</body>

</html>
