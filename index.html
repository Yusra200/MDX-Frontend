<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>School Lessons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <!--Vue3 script tag-->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>

<body>
  <!--connecting html to vue-->
  <div id="app">
    <h1>{{site}}</h1>

    <p> Items in cart:{{cartItemAmount}}</p> <!--counting how many items in cart-->
    </button>

    <main>
      <!--Lessons page visible if showlessons is true-->
      <div v-if="showLessons">
        <div v-for="lesson in lessons" :key="lesson.id">
          <h2>Lesson: {{lesson.title}}</h2>
          <p>Availability:{{lesson.availability}}</p>
          <p>Location:{{lesson.location}}</p>
          <p>Price: {{lesson.price}}</p> <!--better syntax practice than 'vtext'-->

          <!--ADD TO CART BUTTONS linked to addToCart-->
          <button v-on:click="addToCart(lesson)" :disabled="lesson.availability===0">Add to cart</button>
          <!--disabled function-->
        </div>
      </div>

    
    </main>

  </div>
  <script src="app.js"></script>
</body>

</html>
